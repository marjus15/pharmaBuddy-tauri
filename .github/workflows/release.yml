name: Automated PharmaBuddy Release

on:
  push:
    branches:
      - master # Το pipeline θα τρέχει αυτόματα μόνο όταν κάνεις push ή merge στη main

jobs:
  build-and-deploy:
    runs-on: windows-latest # Χρειαζόμαστε Windows runner για να βγει το .exe
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          npm install

      # Required repo secrets: SUPABASE_FUNCTIONS_URL, SUPABASE_ANON_KEY,
      # TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      - name: Verify release secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.SUPABASE_FUNCTIONS_URL }}" ]; then
            echo "::error::Missing GitHub secret SUPABASE_FUNCTIONS_URL"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Missing GitHub secret SUPABASE_ANON_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::Missing GitHub secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "::error::Missing GitHub secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi

      - name: Read app version from tauri.conf.json
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Tauri Application
        run: npm run build
        env:
          # Baked into the binary at compile time — no .env needed on pharmacy PCs
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PHARMABUDDY_PROFILE: prod
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename installer to stable download name
        shell: powershell
        run: |
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $source = Get-ChildItem -Path $nsisDir -Filter "pharmaBuddy_*_x64-setup.exe" | Select-Object -First 1
          if (-not $source) {
            Write-Error "Versioned installer not found in $nsisDir"
            exit 1
          }
          $target = Join-Path $nsisDir "pharmaBuddy_x64-setup.exe"
          if (Test-Path $target) {
            Remove-Item $target -Force
          }
          Copy-Item -Path $source.FullName -Destination $target

      - name: Write latest.json for the updater
        shell: bash
        run: |
          set -euo pipefail
          NSIS="src-tauri/target/release/bundle/nsis"
          SIG=$(find "$NSIS" -name '*x64-setup.exe.sig' | head -n 1)
          if [ -z "$SIG" ]; then
            echo "::error::Updater signature not found. Check TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          EXE=$(basename "${SIG%.sig}")
          VERSION="${{ steps.app_version.outputs.version }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${EXE}"
          node scripts/write-latest-json.mjs \
            --version "$VERSION" \
            --signature-file "$SIG" \
            --url "$URL" \
            --out "$NSIS/latest.json"

      - name: Create GitHub release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: PharmaBuddy v${{ steps.app_version.outputs.version }}
          body: "Production build with embedded Supabase config. Install and scan — no manual setup required. The updater reads latest.json from this release."
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/pharmaBuddy_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/pharmaBuddy_*_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/pharmaBuddy_x64-setup.exe
            src-tauri/target/release/bundle/nsis/latest.json
          fail_on_unmatched_files: true
