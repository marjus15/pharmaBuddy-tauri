<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pharmaBuddy</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./main.js" type="module"></script>
  </head>
  <body>
    <input
      id="scan-fallback"
      type="text"
      autocomplete="off"
      aria-hidden="true"
      tabindex="-1"
    />

    <div id="app-root" class="app-root">
      <div
        id="activation-overlay"
        class="activation-overlay hidden"
        aria-hidden="true"
      >
        <div class="activation-panel">
          <p class="activation-title">Ενεργοποίηση PharmaBuddy</p>
          <p id="activation-desc" class="activation-desc">
            Εισάγετε τον κωδικό ενεργοποίησης από τη σελίδα εγγραφής.
          </p>
          <input
            id="activation-key-input"
            class="activation-input"
            type="text"
            placeholder="PB-XXXX-XXXX"
            autocomplete="off"
            spellcheck="false"
          />
          <p id="activation-error" class="activation-error hidden"></p>
          <button id="activation-submit-btn" class="activation-btn" type="button">
            Ενεργοποίηση
          </button>
        </div>
      </div>

      <div id="login-overlay" class="login-overlay hidden" aria-hidden="true">
        <form id="login-form" class="login-panel" autocomplete="on">
          <p class="login-title">Σύνδεση PharmaBuddy</p>
          <p class="login-desc">Τα στοιχεία σύνδεσης σάς τα δίνει η PharmaBuddy.</p>
          <label class="login-label" for="login-identifier">Email / όνομα χρήστη</label>
          <input
            id="login-identifier"
            class="login-input"
            type="text"
            name="username"
            autocomplete="username"
            spellcheck="false"
            autocapitalize="off"
          />
          <label class="login-label" for="login-password">Κωδικός</label>
          <div class="login-password-row">
            <input
              id="login-password"
              class="login-input"
              type="password"
              name="password"
              autocomplete="current-password"
            />
            <button
              id="login-password-toggle"
              class="login-eye"
              type="button"
              aria-label="Εμφάνιση κωδικού"
              aria-pressed="false"
            >
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8" />
              </svg>
              <svg class="eye-shut" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M3 4l18 16M9.5 9.8A3 3 0 0 0 12 15a3 3 0 0 0 2.2-.9M6.1 6.8C4 8.2 2.6 10.2 2 12c1.2 2.2 4.2 6 10 6 1.6 0 3-.3 4.2-.8M17.8 14.2C20 12.8 21.4 11 22 12c-.5-1-1.4-2.2-2.6-3.3M9.9 6.3A12 12 0 0 1 12 6c5.8 0 8.8 3.8 10 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
          <p id="login-error" class="login-error hidden" role="alert"></p>
          <button id="login-submit" class="login-btn" type="submit">Είσοδος</button>
        </form>
      </div>

      <div id="report-overlay" class="report-overlay hidden" aria-hidden="true">
        <form id="report-form" class="report-panel">
          <div class="report-head">
            <p class="report-title">Αναφορά προβλήματος</p>
            <button id="report-close" class="report-close" type="button" aria-label="Κλείσιμο">
              ×
            </button>
          </div>
          <label class="report-label" for="report-message">Τι έγινε;</label>
          <textarea id="report-message" class="report-message" rows="4" maxlength="2000"></textarea>
          <p id="report-status" class="report-status hidden" role="status"></p>
          <button id="report-send" class="report-send" type="submit">Αποστολή</button>
        </form>
      </div>

      <div
        id="logout-confirm"
        class="logout-confirm hidden"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
        aria-labelledby="logout-confirm-text"
      >
        <div class="logout-confirm-card">
          <p id="logout-confirm-text" class="logout-confirm-text">
            Θέλετε να αποσυνδεθείτε; Θα χρειαστεί ξανά ο κωδικός.
          </p>
          <div class="logout-confirm-actions">
            <button id="logout-cancel" class="logout-cancel" type="button">Άκυρο</button>
            <button id="logout-confirm-btn" class="logout-confirm-btn" type="button">Αποσύνδεση</button>
          </div>
        </div>
      </div>

      <div id="main-layout" class="main-layout">

        <div
          id="drug-sidebar"
          class="drug-sidebar hidden"
          data-drag-region
        >
          <button
            id="sidebar-close-btn"
            class="sidebar-close-btn"
            type="button"
            title="Απόκρυψη"
          >
            ✕
          </button>

          <div id="drug-list" class="drug-list"></div>

          <div id="manual-entry-row" class="manual-entry-row hidden">
            <input
              id="manual-name-input"
              class="manual-name-input"
              type="text"
              placeholder="Όνομα φαρμάκου"
              autocomplete="off"
            />
            <p id="sidebar-lookup-detail" class="lookup-detail hidden"></p>
          </div>
        </div>

        <!-- Orb dock -->
        <div class="orb-dock">
          <div class="orb-glass-plate" aria-hidden="true" data-drag-region></div>
          <div class="orb-shell">
            <div class="orb-chrome">
              <button
                type="button"
                id="orb-manual-btn"
                class="orb-chrome-btn orb-chrome-btn-add"
                title="Χειροκίνητη εισαγωγή ονόματος"
                aria-label="Χειροκίνητη εισαγωγή ονόματος"
              >
                +
              </button>
              <div class="orb-chrome-right">
              <div class="settings-anchor">
              <button
                type="button"
                id="orb-settings-btn"
                class="orb-chrome-btn hidden"
                title="Ρυθμίσεις"
                aria-label="Ρυθμίσεις"
                aria-expanded="false"
                aria-controls="settings-menu"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8" />
                  <path
                    d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
              <div id="settings-menu" class="settings-menu hidden" role="menu">
                <p id="settings-pharmacy" class="settings-pharmacy"></p>
                <p id="settings-email" class="settings-email"></p>
                <button id="report-menu-btn" class="report-menu-btn" type="button" role="menuitem">
                  Αναφορά προβλήματος
                </button>
                <div id="settings-logout-sep" class="settings-divider hidden" role="separator"></div>
                <button id="logout-btn" class="logout-btn" type="button" role="menuitem">
                  Αποσύνδεση
                </button>
              </div>
              </div>
              <button
                type="button"
                id="orb-minimize-btn"
                class="orb-chrome-btn"
                title="Ελαχιστοποίηση"
                aria-label="Ελαχιστοποίηση"
              >
                −
              </button>
              <button
                type="button"
                id="orb-close-btn"
                class="orb-chrome-btn orb-chrome-btn-close"
                title="Κλείσιμο"
                aria-label="Κλείσιμο"
              >
                ×
              </button>
              </div>
            </div>
            <div
              id="orb"
              class="orb state-idle"
              data-drag-region
              role="img"
              aria-label="pharmaBuddy"
            >
            <div class="radar-host">
              <div class="layer vignette"></div>

              <svg class="layer circuits" viewBox="0 0 200 200" aria-hidden="true">
                <line x1="18" y1="42" x2="72" y2="58" />
                <line x1="72" y1="58" x2="98" y2="38" />
                <line x1="128" y1="34" x2="168" y2="52" />
                <line x1="168" y1="52" x2="182" y2="88" />
                <line x1="182" y1="88" x2="156" y2="112" />
                <line x1="156" y1="112" x2="178" y2="148" />
                <line x1="42" y1="162" x2="88" y2="178" />
                <line x1="88" y1="178" x2="118" y2="168" />
                <line x1="24" y1="118" x2="48" y2="142" />
                <line x1="48" y1="142" x2="38" y2="168" />
                <path d="M 120,72 A 14,14 0 1 1 148,72" fill="none" />
              </svg>

              <div class="layer outer-glow"></div>

              <div class="rings-assembly">
                <div class="ring ring-hud"></div>
                <div class="ring ring-a"></div>
                <div class="ring ring-b"></div>
                <div class="ring ring-static-128"></div>
                <div class="ring ring-static-108"></div>
                <svg class="arc arc-a" viewBox="0 0 200 200" aria-hidden="true">
                  <path d="M 100,24 A 76,76 0 0 1 168,68" />
                </svg>
                <svg class="arc arc-b" viewBox="0 0 200 200" aria-hidden="true">
                  <path d="M 32,132 A 76,76 0 0 1 72,176" />
                </svg>
              </div>

              <div class="layer inner-glow"></div>
              <div class="layer core"></div>
              <div class="layer scan-glow"></div>
              <div class="layer scan-line"></div>
              <div class="layer glass"></div>
              <div class="layer flash-overlay"></div>
            </div>
            </div>
          </div>

          <div class="orb-footer" data-drag-region>
            <p id="orb-label" class="orb-label">PharmaBuddy AI</p>
            <p id="orb-pharmacy-name" class="orb-pharmacy-name pharmacy-corner hidden"></p>
            <p id="update-note" class="update-note hidden"></p>
            <!-- Debug: last scan status (hidden — re-enable for scanner troubleshooting)
            <p id="orb-scan-display" class="orb-scan-display" title="Τελευταίο scan">—</p>
            -->
            <!-- Debug: live keyboard hook buffer (hidden — re-enable for scanner troubleshooting)
            <p id="orb-hook-buffer" class="orb-hook-buffer" title="Live hook buffer">HOOK[0]: —</p>
            -->
            <!-- Profile badge hidden — app runs PROD by default (see env_config.rs)
            <button
              id="profile-badge"
              class="profile-badge"
              type="button"
              title="Εναλλαγή TEST / PROD"
            >
              PROD
            </button>
            -->
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
